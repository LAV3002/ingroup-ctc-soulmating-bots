[project]
name = "regabot"
version = "0.1.0"
description = "Telegram bot for stage-based soulmating event (RegaBot)"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[rate-limiter]==22.*",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
